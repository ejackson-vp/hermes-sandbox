[project]
name = "hermes-sandbox"
version = "0.1.0"
description = "Hermes terminal-environment provider that runs commands in an x402 sandbox"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pynacl>=1.5,<2",
    "eth-account>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermes_sandbox*"]

[tool.ruff]
line-length = 110
target-version = "py311"
