# Hermes: a persistent personal agent that runs its commands in the sandbox.
#
# Cluster-specific values (image tag, API URL) are patched by the homelab repo's
# Flux Kustomization, so this overlay stays deployable on its own.
#
# Secrets are NOT created here. `hermes-secrets` must exist in the `hermes`
# namespace before the pod starts, and `hermes-payer-key` too when a stable payer
# address is allowlisted in the sandbox. In the homelab both are SOPS-encrypted in
# apps/hermes-secrets/. See docs/setup.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

resources:
  - namespace.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - backup-cronjob.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: hermes
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
