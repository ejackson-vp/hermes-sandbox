# Hermes configuration. Everything here is non-secret.
#
# Secrets (the GraphN key, the Signal account) come from the `hermes-secrets`
# Secret in the homelab repo, never from this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  config.yaml: |
    # Every shell command, file operation and code execution runs in a sandbox
    # microVM. There is no local fallback: if the sandbox API is down, commands
    # fail rather than run on this host.
    terminal:
      backend: sandbox
      cwd: /workspace
      # A fresh sandbox per session. Hermes' own state lives on the PVC; only
      # the workspace is disposable.
      container_persistent: false

    # GraphN accepts reasoning_effort of none/low/high but rejects "medium",
    # which is Hermes' default, with a generic 400 "the model rejected the
    # request". Set explicitly; do not remove without re-testing.
    agent:
      reasoning_effort: "high"

    model:
      provider: graphn
      default: deepseek-v4.1-flash

    # Cluster access as a tool, not as a credential in the sandbox. `trust:
    # untrusted` makes Hermes ask in Signal before any tool that is not
    # annotated read-only, which is every write and the secret read.
    mcp_servers:
      kube:
        command: /opt/hermes/.venv/bin/python
        args: ["/opt/hermes/tools/mcp_kubectl.py"]
        trust: untrusted
        timeout: 90
      # GitHub's hosted MCP server. The PAT is fine-grained and scoped to
      # personal repositories only, so work-org resources are unreachable even
      # if the token leaks. 28 of its 46 tools are annotated readOnlyHint, so
      # the trust gate prompts for the other 18 and nothing else.
      github:
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: "Bearer ${GITHUB_TOKEN}"
        trust: untrusted
        timeout: 120

    providers:
      graphn:
        base_url: https://model.graphn.ai/v1
        key_env: GRAPHN_API_KEY
        # The only context_length: Hermes reads the per-route entry, not
        # model.context_length (tried, ignored, logged "1M (detected)").
        # Prompt + output budget must stay under GraphN's real ceiling, measured
        # between 800k and 1.6M. 256k holds the 59 MCP tool schemas plus a
        # working conversation without compacting every turn.
        context_length: 262144

  # Non-secret runtime settings for the sandbox provider.
  #
  # TERMINAL_ENV is not redundant with terminal.backend above: `hermes config set
  # terminal.backend` writes both this variable and the YAML key, and the
  # terminal tool reads the variable. Setting only the YAML leaves the runtime
  # free to fall back to `local`, which is the one outcome this deployment must
  # not have.
  TERMINAL_ENV: "sandbox"
  SANDBOX_API_URL: "http://api.sandbox-system.svc.cluster.local:3000"
  SANDBOX_VERIFY_TLS: "false"
  SANDBOX_TIER: "standard"
  SANDBOX_IMAGE: "guest"
  SANDBOX_MAX_COMMAND_SECONDS: "300"
  SANDBOX_MIN_REMAINING_SECONDS: "60"
  SANDBOX_CARRY_WORKSPACE: "true"

  # signal-cli runs in the same pod network namespace, so this never leaves the
  # pod. SIGNAL_ACCOUNT and SIGNAL_ALLOWED_USERS come from the Secret once the
  # device is linked.
  SIGNAL_HTTP_URL: "http://127.0.0.1:8080"
  # The persona, plus this deployment's ground rules. Without the second half the
  # agent looks for kubectl in the sandbox, does not find it, and reports that it
  # "cannot verify the cluster" instead of using the tool that is right there.
  SOUL.md: |
    You are Hermes Agent, built by Nous Research. Be direct: match the length of your reply to the weight of the ask. No filler, no restating the request, no narrating tool calls. Plain claims over adjectives; when unsure, say so plainly.

    ## This deployment

    The terminal tool runs commands in an isolated sandbox microVM. That sandbox
    has no cluster credentials and no route to the Kubernetes API, and it must
    never be given any. An absent kubectl, kubeconfig, gh binary or token there is
    the design, not a fault, and not a reason to say something is unverifiable.

    - **Kubernetes**: use the `mcp__kube__*` tools. They run in the agent pod with
      the pod's ServiceAccount. Reads: `kube_get`, `kube_describe`, `kube_logs`,
      `kube_events`. Changes: `kube_apply`, `kube_delete`, `kube_scale`,
      `kube_rollout`. Secrets: `kube_secret_get`.
    - **GitHub**: use the `mcp__github__*` tools. They run in the agent pod with a
      token scoped to personal repositories. There is no `gh` CLI in the sandbox.
    - Both servers are held to a trust gate: Hermes asks the user before any call
      that is not read-only. That prompt is expected. Wait for the answer; never
      work around it.
    - Never copy a credential, kubeconfig or token into the sandbox, and never ask
      the user to paste one into a command.
    - Keep cluster reads small. For "is it healthy" use `output=name` or a
      selector and one namespace at a time; do not pull `-o json` for a whole
      namespace or list every pod across the cluster unless the user asks for
      that detail. A full-cluster sweep costs more tokens than the answer is
      worth.
    - To prove where a command ran, read the hostname: guests are `sbx-...`.
