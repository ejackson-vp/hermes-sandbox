# Hermes configuration. Everything here is non-secret.
#
# Secrets (the GraphN key, the Signal account) come from the `hermes-secrets`
# Secret in the homelab repo, never from this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  config.yaml: |
    # Every shell command, file operation and code execution runs in a sandbox
    # microVM. There is no local fallback: if the sandbox API is down, commands
    # fail rather than run on this host.
    terminal:
      backend: sandbox
      cwd: /workspace
      # A fresh sandbox per session. Hermes' own state lives on the PVC; only
      # the workspace is disposable.
      container_persistent: false

    # GraphN accepts reasoning_effort of none/low/high but rejects "medium",
    # which is Hermes' default, with a generic 400 "the model rejected the
    # request". Set explicitly; do not remove without re-testing.
    agent:
      reasoning_effort: "high"

    model:
      provider: graphn
      default: deepseek-v4.1-flash
      # GraphN advertises a very large window and Hermes otherwise derives the
      # output budget from it, so a ~20k prompt plus a ~1M max_tokens was
      # rejected with "the request exceeds this model's context window":
      # measured ceiling is between 800k and 1.6M, and the sum has to fit.
      # 128k is more than a personal assistant needs and keeps the sum safe.
      context_length: 131072

    providers:
      graphn:
        base_url: https://model.graphn.ai/v1
        key_env: GRAPHN_API_KEY
        # Entry-level override, which backs every model this route serves. Hermes
        # otherwise detects the window from the endpoint (1M here) and derives the
        # output budget from it, and GraphN then rejects prompt plus budget.
        context_length: 131072

  # Non-secret runtime settings for the sandbox provider.
  #
  # TERMINAL_ENV is not redundant with terminal.backend above: `hermes config set
  # terminal.backend` writes both this variable and the YAML key, and the
  # terminal tool reads the variable. Setting only the YAML leaves the runtime
  # free to fall back to `local`, which is the one outcome this deployment must
  # not have.
  TERMINAL_ENV: "sandbox"
  SANDBOX_API_URL: "http://api.sandbox-system.svc.cluster.local:3000"
  SANDBOX_VERIFY_TLS: "false"
  SANDBOX_TIER: "standard"
  SANDBOX_IMAGE: "guest"
  SANDBOX_MAX_COMMAND_SECONDS: "300"
  SANDBOX_MIN_REMAINING_SECONDS: "60"
  SANDBOX_CARRY_WORKSPACE: "true"

  # signal-cli runs in the same pod network namespace, so this never leaves the
  # pod. SIGNAL_ACCOUNT and SIGNAL_ALLOWED_USERS come from the Secret once the
  # device is linked.
  SIGNAL_HTTP_URL: "http://127.0.0.1:8080"
