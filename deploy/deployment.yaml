apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels: {app: hermes}
spec:
  # One writer. Hermes keeps its state in SQLite on a ReadWriteOnce volume, and a
  # second replica would corrupt it rather than share it. The gateway is
  # restarted in place, not scaled out.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: hermes}
  template:
    metadata:
      labels: {app: hermes}
    spec:
      # Holds the cluster credential, reachable only through the MCP tools.
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      # s6-overlay runs as root, chowns /opt/data and then drops every supervised
      # service to uid 10000 itself. Pod-level runAsNonRoot would break the
      # chown, so the drop is the image's job and this is deliberate.
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      # Never schedule next to the Kata guest pool.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # local-path gives the volume a root-owned directory, and s6's own chown is
      # best-effort, so the state directory can stay root-owned with mode 0777.
      # The gateway runs anyway but `hermes` CLI invocations refuse: "owned by
      # uid 0, expected 10000". Fix the owner once, cheaply, at start.
      initContainers:
        - name: fix-ownership
          image: ghcr.io/ejackson-vp/hermes-sandbox:0.1.6
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Hermes refuses a state directory it does not own, and refuses one
              # writable by anyone else. local-path delivers root:root 0777.
              if [ "$(stat -c %u /opt/data)" != "10000" ]; then
                echo "chowning /opt/data to 10000:10000"
                chown -R 10000:10000 /opt/data
              fi
              # Idempotent and cheap: one directory, not a tree walk.
              chmod go-w /opt/data

              # Hermes resolves ${VAR} in MCP url/headers from this profile's
              # .env, not from the process environment, so the GitHub token has
              # to be written here. Rewritten on every start, so rotating the
              # Secret is enough. The file is never mounted into the sandbox.
              if [ -f /secrets/github-token ]; then
                token=$(cat /secrets/github-token)
                touch /opt/data/.env
                grep -v '^GITHUB_TOKEN=' /opt/data/.env > /opt/data/.env.tmp || true
                printf 'GITHUB_TOKEN=%s\n' "$token" >> /opt/data/.env.tmp
                mv /opt/data/.env.tmp /opt/data/.env
                chown 10000:10000 /opt/data/.env
                chmod 600 /opt/data/.env
                echo "seeded GITHUB_TOKEN into .env"
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: github-token
              mountPath: /secrets
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
      containers:
        - name: hermes
          image: ghcr.io/ejackson-vp/hermes-sandbox:0.1.6
          imagePullPolicy: IfNotPresent
          # The image entrypoint is s6's dispatcher; this is its main program.
          args: ["gateway", "run"]
          envFrom:
            - configMapRef:
                name: hermes-config
          env:
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            - name: HERMES_HOME
              value: /opt/data
            - name: GRAPHN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: graphn-api-key
                  optional: true
            # Only these senders are answered. Groups stay off: no
            # SIGNAL_GROUP_ALLOWED_USERS, which is the default and the right one
            # for a personal assistant.
            - name: SIGNAL_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: signal-account
                  optional: true
            - name: SIGNAL_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: signal-allowed-users
                  optional: true
            # Default delivery target for cron jobs and proactive messages. Your
            # own number means those land in the same Note to Self conversation.
            - name: SIGNAL_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: signal-home-channel
                  optional: true
            # Read by the GitHub MCP server config, and by nothing else. It never
            # reaches the sandbox: the guest has no environment from the host.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: github-token
                  optional: true
          ports:
            - name: gateway
              containerPort: 8765
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            # Sized for a 13.5 GiB control-plane node that also runs etcd.
            requests: {cpu: 200m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          # Startup and readiness only check that the gateway recorded itself.
          # `hermes gateway status` takes several seconds (it is a fresh Python
          # process), which is far too slow for a 1s default probe timeout, so it
          # is reserved for liveness where it is authoritative and rare.
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "test -s /opt/data/gateway.pid"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -s /opt/data/gateway.pid"]
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "/opt/hermes/bin/hermes gateway status >/dev/null 2>&1"]
            periodSeconds: 120
            timeoutSeconds: 30
            # Generous: a busy turn must not be mistaken for a hang.
            failureThreshold: 3

        # signal-cli in the same pod, so Hermes reaches it on 127.0.0.1:8080 and
        # nothing is exposed: no Service, no ingress, no NetworkPolicy ingress
        # rule. It idles until the QR is scanned, then runs the HTTP daemon.
        - name: signal-cli
          # Its own package on purpose. Two unrelated images under one package
          # would share a provenance story and let a tag point at an image it
          # has no business being.
          image: ghcr.io/ejackson-vp/signal-cli:0.14.10
          imagePullPolicy: IfNotPresent
          # The image entrypoint is `signal-cli --config /var/lib/signal-cli`, so
          # these are its arguments. HTTP is bound inside the pod's loopback:
          # nothing outside the pod can reach the daemon.
          args:
            - "--account"
            - "+18013002620"
            - "daemon"
            - "--http"
            - "127.0.0.1:8080"
          env:
            # The volume is fsGroup 10000, so run as that group rather than the
            # image's own uid and let it write the account database.
            - name: HOME
              value: /var/lib/signal-cli
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          volumeMounts:
            - name: signal-cli
              mountPath: /var/lib/signal-cli
          resources:
            # JVM idle. Bursts during attachment upload.
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config
          configMap:
            name: hermes-config
        - name: signal-cli
          persistentVolumeClaim:
            claimName: signal-cli-data
        - name: github-token
          secret:
            secretName: hermes-secrets
            optional: true
            items:
              - key: github-token
                path: github-token
