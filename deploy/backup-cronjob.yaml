# Nightly state backup.
#
# What this protects: conversation history, memory, cron jobs and the sandbox
# session map. What it does not protect: a coherent snapshot taken while the
# gateway is idle. SQLite in WAL mode is copied with `sqlite3 .backup` where the
# binary exists, which is safe against concurrent writers; anything else falls
# back to `tar`, and the log says which happened.
#
# Restore procedure: docs/backup.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-backup
  namespace: hermes
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 10000
          containers:
            - name: backup
              image: ghcr.io/ejackson-vp/hermes-sandbox:0.1.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  dest="/backups/${stamp}"
                  mkdir -p "$dest"
                  echo "backup: $stamp -> $dest"

                  # Consistent copies of every SQLite database. The image has no
                  # sqlite3 CLI, but it does have Python, and the backup API is
                  # safe against a live writer (unlike tar, which can capture a
                  # torn WAL). state.db is the conversation history.
                  /opt/hermes/.venv/bin/python - "$dest" <<'PY'
                  import pathlib, sqlite3, sys
                  dest, src = pathlib.Path(sys.argv[1]), pathlib.Path("/opt/data")
                  copied = skipped = 0
                  for db in sorted(list(src.rglob("*.db")) + list(src.rglob("*.sqlite"))):
                      if "cache" in db.parts:
                          continue
                      target = dest / db.relative_to(src)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      try:
                          with sqlite3.connect(f"file:{db}?mode=ro", uri=True) as reader, \
                                  sqlite3.connect(target) as writer:
                              reader.backup(writer)
                          copied += 1
                      except sqlite3.Error as exc:
                          skipped += 1
                          print(f"backup: skipped {db.name}: {exc}")
                  print(f"backup: {copied} database(s) copied, {skipped} skipped")
                  PY

                  # Everything else: config, cron definitions, skills, plugins.
                  # Databases are excluded above, so a torn page cannot land here.
                  tar -czf "$dest/state.tar.gz" \
                    --exclude='*/cache' \
                    --exclude='*/.venv' \
                    --exclude='*.db' --exclude='*.db-wal' --exclude='*.db-shm' \
                    --exclude='*.sqlite' \
                    -C /opt/data . 2>/dev/null || true
                  echo "backup: archive $(du -h "$dest/state.tar.gz" | cut -f1)"

                  # Keep 7 days.
                  find /backups -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
                  echo "backup: done"
              volumeMounts:
                # Not readOnly: opening a WAL-mode database in `mode=ro` still
                # needs to create the -shm file beside it, so a read-only mount
                # makes SQLite report "unable to open database file" for every
                # database in WAL mode. This job only ever writes to /backups.
                - name: data
                  mountPath: /opt/data
                - name: backups
                  mountPath: /backups
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {cpu: 500m, memory: 512Mi}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: hermes-data
            - name: backups
              persistentVolumeClaim:
                claimName: hermes-backups
